<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>33Daily</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #d9d6ce;
    color: #292a27;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    padding: 28px 20px 100px;
    background: #f7f3eb;
}

/* ---------- Header ---------- */

.logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 4px;
}

.date {
    margin-top: 35px;
    color: #8a877f;
    font-size: 12px;
    letter-spacing: 1.5px;
}

h1 {
    margin: 8px 0 28px;
    font-family: Georgia, serif;
    font-size: 36px;
    font-weight: 400;
}

/* ---------- Empty ---------- */

.empty {
    padding: 42px 20px;
    border-radius: 24px;
    background: #ebe7dc;
    text-align: center;
}

.empty-title {
    margin-bottom: 10px;
    font-family: Georgia, serif;
    font-size: 25px;
}

.empty-text {
    color: #817e76;
    font-size: 13px;
    line-height: 1.7;
}

/* ---------- Buttons ---------- */

.action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

.add-button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 17px;
    background: #343630;
    color: white;
    font-size: 13px;
    letter-spacing: .5px;
    cursor: pointer;
}

.add-button.secondary {
    background: #d8ded1;
    color: #292a27;
    font-weight: 600;
}

/* ---------- Activity & Weight Card ---------- */

.activity-card {
    display: flex;
    align-items: center;
    gap: 15px;

    margin-bottom: 12px;
    padding: 18px;

    border-radius: 22px;
    background: #ebe7dc;
}

.activity-icon {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 50%;
    background: #d8ded1;

    font-size: 23px;
}

.activity-info {
    flex: 1;
}

.activity-name {
    font-family: Georgia, serif;
    font-size: 20px;
}

.activity-meta {
    margin-top: 6px;

    color: #817e76;
    font-size: 11px;
}

.activity-kcal {
    text-align: right;

    color: #817e76;
    font-size: 10px;
}

.activity-kcal strong {
    display: block;

    color: #292a27;
    font-size: 17px;
}

/* ---------- Total ---------- */

.total {
    display: flex;
    justify-content: center;
    gap: 28px;

    margin-top: 22px;

    color: #817e76;
    font-size: 10px;
}

.total strong {
    color: #292a27;
    font-size: 14px;
}

/* ---------- Bottom Nav ---------- */

.nav {
    position: fixed;
    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: 100%;
    max-width: 520px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    padding: 12px 10px;

    background: rgba(247,243,235,.96);

    border-top: 1px solid #e4dfd5;

    backdrop-filter: blur(10px);
}

.nav button {
    border: none;
    background: none;

    color: #96928a;

    font-size: 11px;
}

.nav button.active {
    color: #292a27;
    font-weight: 600;
}

.nav-icon {
    display: block;
    margin-bottom: 4px;
    font-size: 17px;
}

/* ---------- Screen ---------- */

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.back {
    border: none;
    background: none;

    padding: 0;

    color: #817e76;
    font-size: 13px;

    cursor: pointer;
}

.form-title {
    margin: 30px 0;

    font-family: Georgia, serif;
    font-size: 31px;
    font-weight: 400;
}

label {
    display: block;

    margin: 20px 0 8px;

    color: #817e76;

    font-size: 10px;
    font-weight: 600;

    letter-spacing: 1.5px;
}

input,
select {
    width: 100%;

    padding: 13px;

    border: 1px solid #d8d3c8;
    border-radius: 14px;

    background: #fcf9f2;

    color: #292a27;
}

.types {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.type-button {
    padding: 10px 13px;

    border: 1px solid #d6d1c6;
    border-radius: 15px;

    background: transparent;

    font-size: 12px;
}

.type-button.selected {
    background: #9baa8f;
    border-color: #9baa8f;
    color: white;
}

.save-button {
    width: 100%;

    margin-top: 28px;
    padding: 16px;

    border: none;
    border-radius: 17px;

    background: #343630;
    color: white;

    font-size: 13px;
    cursor: pointer;
}

/* ---------- Summary ---------- */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.stat {
    padding: 17px 6px;
    border-radius: 18px;
    background: #ebe7dc;
    text-align: center;
}

.stat strong {
    display: block;

    font-family: Georgia, serif;
    font-size: 20px;
    font-weight: 400;
}

.stat span {
    color: #817e76;
    font-size: 9px;
}

/* ---------- Calendar ---------- */

.calendar {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 7px;
}

.week {
    text-align: center;
    color: #99958c;
    font-size: 9px;
}

.day {
    aspect-ratio: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 2px;
    border: none;
    border-radius: 13px;

    background: #ebe7dc;
}

.day.has {
    background: #d8ded1;
}

.day-number {
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
}

.day-info {
    margin-top: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    font-size: 8px;
    line-height: 1;
}

.day-kcal {
    color: #4a6344;
    font-weight: 600;
}

.day-weight {
    color: #706d64;
}

/* ---------- Desktop ---------- */

@media (min-width: 700px) {

    .app {
        margin: 20px auto;
        min-height: calc(100vh - 40px);
        border-radius: 30px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TODAY -->
    <section id="today" class="screen active">

        <div class="logo">
            33DAILY
        </div>

        <div class="date" id="todayDate"></div>

        <h1>
            Today's Activity
        </h1>

        <div id="todayContent"></div>

        <div class="action-buttons">
            <button class="add-button" onclick="showAdd()">
                ＋ ACTIVITY
            </button>
            <button class="add-button secondary" onclick="showAddWeight()">
                ⚖️ WEIGHT
            </button>
        </div>

        <div
            class="total"
            id="todayTotal">
        </div>

    </section>


    <!-- ADD ACTIVITY -->
    <section id="add" class="screen">

        <button
            class="back"
            onclick="showPage('today')">

            ← Back

        </button>

        <div class="form-title">
            Add Activity
        </div>


        <label>
            DATE
        </label>

        <input
            id="activityDate"
            type="date">


        <label>
            ACTIVITY
        </label>

        <div
            class="types"
            id="activityTypes">
        </div>


        <label>
            DURATION · MINUTES
        </label>

        <input
            id="duration"
            type="number"
            min="1"
            value="30">


        <label>
            EQUIPMENT
        </label>

        <select id="equipment">

            <option>None</option>
            <option>Yoga Mat</option>
            <option>Dumbbells</option>
            <option>Resistance Band</option>
            <option>Treadmill</option>
            <option>Bike</option>
            <option>Other</option>

        </select>


        <label>
            INTENSITY
        </label>

        <select id="intensity">

            <option value="low">
                Low
            </option>

            <option
                value="medium"
                selected>

                Medium

            </option>

            <option value="high">
                High
            </option>

        </select>


        <label>
            CALORIES
        </label>

        <input
            id="calories"
            type="number"
            placeholder="Auto calculated">


        <button
            class="save-button"
            onclick="saveActivity()">

            SAVE ACTIVITY

        </button>

    </section>


    <!-- ADD WEIGHT -->
    <section id="addWeight" class="screen">

        <button
            class="back"
            onclick="showPage('today')">

            ← Back

        </button>

        <div class="form-title">
            Weight
        </div>

        <label>
            DATE
        </label>

        <input
            id="weightLogDate"
            type="date">

        <label>
            WEIGHT · KG
        </label>

        <input
            id="weightLogValue"
            type="number"
            step="0.1"
            placeholder="57.0">

        <button
            class="save-button"
            onclick="saveWeightLog()">

            SAVE WEIGHT

        </button>

    </section>


    <!-- CALENDAR -->
    <section
        id="calendar"
        class="screen">

        <div class="logo">
            33DAILY
        </div>

        <div class="form-title">
            Calendar
        </div>

        <div class="calendar">

            <div class="week">M</div>
            <div class="week">T</div>
            <div class="week">W</div>
            <div class="week">T</div>
            <div class="week">F</div>
            <div class="week">S</div>
            <div class="week">S</div>

        </div>

        <div
            id="calendarDays"
            class="calendar">
        </div>

    </section>


    <!-- SUMMARY -->
    <section
        id="summary"
        class="screen">

        <div class="logo">
            33DAILY
        </div>

        <div class="form-title">
            Summary
        </div>

        <div
            id="summaryStats"
            class="stats">
        </div>

        <div class="form-title">
            History Log
        </div>

        <div
            id="summaryList">
        </div>

    </section>


    <!-- ME -->
    <section
        id="me"
        class="screen">

        <div class="logo">
            33DAILY
        </div>

        <div class="form-title">
            My Profile
        </div>


        <label>
            WEIGHT · KG
        </label>

        <input
            id="weight"
            type="number"
            step="0.1"
            value="57">


        <label>
            HEIGHT · CM
        </label>

        <input
            id="height"
            type="number"
            value="155">


        <button
            class="save-button"
            onclick="saveProfile()">

            SAVE PROFILE

        </button>

    </section>

</div>


<!-- NAVIGATION -->

<nav class="nav">

    <button
        class="active"
        onclick="showPage('today')">

        <span class="nav-icon">
            ○
        </span>

        Today

    </button>


    <button
        onclick="showPage('calendar')">

        <span class="nav-icon">
            □
        </span>

        Calendar

    </button>


    <button
        onclick="showPage('summary')">

        <span class="nav-icon">
            ◒
        </span>

        Summary

    </button>


    <button
        onclick="showPage('me')">

        <span class="nav-icon">
            ○
        </span>

        Me

    </button>

</nav>


<script>

/* =========================
   DATA
========================= */

const activities = [

    {
        id: "strength",
        name: "Strength",
        icon: "🏋️",
        met: 5
    },

    {
        id: "yoga",
        name: "Yoga",
        icon: "🧘",
        met: 3
    },

    {
        id: "running",
        name: "Running",
        icon: "🏃",
        met: 8
    },

    {
        id: "walking",
        name: "Walking",
        icon: "🚶",
        met: 3.5
    },

    {
        id: "cycling",
        name: "Cycling",
        icon: "🚴",
        met: 6.5
    },

    {
        id: "hiit",
        name: "HIIT",
        icon: "🔥",
        met: 8
    },

    {
        id: "swimming",
        name: "Swimming",
        icon: "🏊",
        met: 7
    },

    {
        id: "Cardio Dance",
        name: "Cardio Dance",
        icon: "🤸",
        met: 2.5
    },

    {
        id: "other",
        name: "Other",
        icon: "✦",
        met: 4
    }

];


/* =========================
   STORAGE
========================= */

let records =
    JSON.parse(
        localStorage.getItem(
            "33daily_records"
        ) || "[]"
    );

let weightLogs =
    JSON.parse(
        localStorage.getItem(
            "33daily_weight_logs"
        ) || "[]"
    );

let profile =
    JSON.parse(
        localStorage.getItem(
            "33daily_profile"
        )
        ||
        '{"weight":57,"height":155}'
    );


let selectedActivity =
    "strength";


/* =========================
   DATE
========================= */

function getToday() {

    const d = new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =========================
   INITIALIZE
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        document.getElementById(
            "todayDate"
        ).textContent =
            new Date()
            .toLocaleDateString(
                "en-US",
                {
                    month:"long",
                    day:"numeric",
                    year:"numeric"
                }
            )
            .toUpperCase();


        document.getElementById(
            "activityDate"
        ).value =
            getToday();

        document.getElementById(
            "weightLogDate"
        ).value =
            getToday();


        document.getElementById(
            "weight"
        ).value =
            profile.weight;


        document.getElementById(
            "height"
        ).value =
            profile.height;


        renderActivityTypes();

        renderToday();

    }
);


/* =========================
   PAGE
========================= */

function showPage(page) {

    document
        .querySelectorAll(".screen")
        .forEach(
            screen =>
                screen.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(page)
        .classList.add("active");


    document
        .querySelectorAll(".nav button")
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


    const buttons =
        document.querySelectorAll(
            ".nav button"
        );


    const index = {

        today: 0,
        calendar: 1,
        summary: 2,
        me: 3

    }[page];


    if (buttons[index] !== undefined) {

        buttons[index]
            .classList.add("active");

    }


    if (page === "today") {

        renderToday();

    }


    if (page === "calendar") {

        renderCalendar();

    }


    if (page === "summary") {

        renderSummary();

    }

}


/* =========================
   ADD PAGE
========================= */

function showAdd() {

    document.getElementById(
        "activityDate"
    ).value =
        getToday();


    showPage("add");

}

function showAddWeight() {

    document.getElementById(
        "weightLogDate"
    ).value =
        getToday();

    document.getElementById(
        "weightLogValue"
    ).value =
        profile.weight;

    showPage("addWeight");

}


/* =========================
   ACTIVITY TYPES
========================= */

function renderActivityTypes() {

    const container =
        document.getElementById(
            "activityTypes"
        );


    container.innerHTML = "";


    activities.forEach(
        activity => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "type-button";


            if (
                activity.id ===
                selectedActivity
            ) {

                button.classList.add(
                    "selected"
                );

            }


            button.innerHTML =
                `${activity.icon}
                 ${activity.name}`;


            button.onclick =
                function() {

                    selectedActivity =
                        activity.id;


                    renderActivityTypes();

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================
   CALORIES
========================= */

function calculateCalories() {

    const activity =
        activities.find(
            item =>
                item.id ===
                selectedActivity
        );


    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        ) || 0;


    const intensity =
        document.getElementById(
            "intensity"
        ).value;


    const multiplier = {

        low: 0.8,
        medium: 1,
        high: 1.25

    };


    return Math.round(

        activity.met
        *
        profile.weight
        *
        duration
        /
        60
        *
        multiplier[intensity]

    );

}


document.getElementById(
    "duration"
).addEventListener(
    "input",
    function() {

        document.getElementById(
            "calories"
        ).value =
            calculateCalories();

    }
);


document.getElementById(
    "intensity"
).addEventListener(
    "change",
    function() {

        document.getElementById(
            "calories"
        ).value =
            calculateCalories();

    }
);


/* =========================
   SAVE ACTIVITY
========================= */

function saveActivity() {

    const date =
        document.getElementById(
            "activityDate"
        ).value;


    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    if (!date || !duration) {

        alert(
            "Please enter date and duration."
        );

        return;

    }


    const activity =
        activities.find(
            item =>
                item.id ===
                selectedActivity
        );


    let calories =
        Number(
            document.getElementById(
                "calories"
            ).value
        );


    if (!calories) {

        calories =
            calculateCalories();

    }


    records.push({

        id:
            Date.now(),

        date:
            date,

        type:
            selectedActivity,

        duration:
            duration,

        equipment:
            document.getElementById(
                "equipment"
            ).value,

        intensity:
            document.getElementById(
                "intensity"
            ).value,

        calories:
            calories

    });


    localStorage.setItem(

        "33daily_records",

        JSON.stringify(records)

    );


    showPage("today");

}


/* =========================
   SAVE WEIGHT LOG
========================= */

function saveWeightLog() {

    const date =
        document.getElementById(
            "weightLogDate"
        ).value;

    const val =
        Number(
            document.getElementById(
                "weightLogValue"
            ).value
        );

    if (!date || !val) {

        alert("Please enter a valid weight and date.");

        return;

    }

    const existingIndex = weightLogs.findIndex(item => item.date === date);

    if (existingIndex >= 0) {

        weightLogs[existingIndex].weight = val;

    } else {

        weightLogs.push({
            id: Date.now(),
            date: date,
            weight: val
        });

    }

    localStorage.setItem(
        "33daily_weight_logs",
        JSON.stringify(weightLogs)
    );

    profile.weight = val;
    document.getElementById("weight").value = val;

    localStorage.setItem(
        "33daily_profile",
        JSON.stringify(profile)
    );

    showPage("today");

}


/* =========================
   TODAY
========================= */

function renderToday() {

    const container =
        document.getElementById(
            "todayContent"
        );


    const todayRecords =
        records.filter(
            record =>
                record.date ===
                getToday()
        );

    const todayWeight =
        weightLogs.find(
            item =>
                item.date ===
                getToday()
        );


    if (
        todayRecords.length === 0 && !todayWeight
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    No activity yet.
                </div>

                <div class="empty-text">

                    How would you like
                    to move today?

                </div>

            </div>

        `;

    }

    else {

        let html = "";

        if (todayWeight) {

            html += `
                <div class="activity-card">
                    <div class="activity-icon">⚖️</div>
                    <div class="activity-info">
                        <div class="activity-name">Weight</div>
                        <div class="activity-meta">${todayWeight.date}</div>
                    </div>
                    <div class="activity-kcal">
                        <strong>${todayWeight.weight}</strong> KG
                    </div>
                </div>
            `;

        }

        html += todayRecords

            .map(
                record => {

                    const activity =
                        activities.find(
                            item =>
                                item.id ===
                                record.type
                        );


                    return `

                        <div
                            class="activity-card"
                        >

                            <div
                                class="activity-icon"
                            >

                                ${activity.icon}

                            </div>


                            <div
                                class="activity-info"
                            >

                                <div
                                    class="activity-name"
                                >

                                    ${activity.name}

                                </div>


                                <div
                                    class="activity-meta"
                                >

                                    ${record.duration}
                                    MIN
                                    ·
                                    ${record.equipment}
                                    ·
                                    ${record.intensity}

                                </div>

                            </div>


                            <div
                                class="activity-kcal"
                            >

                                <strong>
                                    ${record.calories}
                                </strong>

                                KCAL

                            </div>

                        </div>

                    `;

                }
            )

            .join("");

        container.innerHTML = html;

    }


    const minutes =
        todayRecords.reduce(
            (sum,record) =>
                sum +
                Number(record.duration),
            0
        );


    const calories =
        todayRecords.reduce(
            (sum,record) =>
                sum +
                Number(record.calories),
            0
        );


    document.getElementById(
        "todayTotal"
    ).innerHTML = `

        <span>
            <strong>
                ${todayRecords.length}
            </strong>
            ACTIVITIES
        </span>

        <span>
            <strong>
                ${minutes}
            </strong>
            MIN
        </span>

        <span>
            <strong>
                ${calories}
            </strong>
            KCAL
        </span>

    `;

}


/* =========================
   CALENDAR
========================= */

function renderCalendar() {

    const container =
        document.getElementById(
            "calendarDays"
        );


    container.innerHTML = "";


    const now = new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth();


    const first =
        new Date(
            year,
            month,
            1
        );


    const totalDays =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    let start =
        first.getDay();


    start =
        start === 0
        ? 6
        : start - 1;


    for (
        let i = 0;
        i < start;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        container.appendChild(
            empty
        );

    }


    for (
        let day = 1;
        day <= totalDays;
        day++
    ) {

        const date =

            `${year}-${String(month + 1)
                .padStart(2,"0")}-${String(day)
                .padStart(2,"0")}`;


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "day";


        const dayRecords = records.filter(record => record.date === date);
        const dayWeightLog = weightLogs.find(log => log.date === date);

        const totalKcal = dayRecords.reduce((sum, item) => sum + Number(item.calories), 0);

        let infoHtml = "";

        if (totalKcal > 0) {
            infoHtml += `<span class="day-kcal">${totalKcal}c</span>`;
        }

        if (dayWeightLog) {
            infoHtml += `<span class="day-weight">${dayWeightLog.weight}kg</span>`;
        }

        button.innerHTML = `
            <span class="day-number">${day}</span>
            <div class="day-info">${infoHtml}</div>
        `;

        if (dayRecords.length > 0 || dayWeightLog) {

            button.classList.add(
                "has"
            );

        }


        container.appendChild(
            button
        );

    }

}


/* =========================
   SUMMARY
========================= */

function renderSummary() {

    const month =
        getToday().slice(0,7);


    const monthRecords =
        records.filter(
            record =>
                record.date.startsWith(
                    month
                )
        );

    const monthWeightLogs =
        weightLogs.filter(
            log =>
                log.date.startsWith(
                    month
                )
        );


    const workouts =
        monthRecords.length;


    const minutes =
        monthRecords.reduce(
            (sum,record) =>
                sum +
                Number(record.duration),
            0
        );


    const calories =
        monthRecords.reduce(
            (sum,record) =>
                sum +
                Number(record.calories),
            0
        );

    let latestWeightDisplay = "--";
    if (weightLogs.length > 0) {
        const sorted = weightLogs.slice().sort((a,b) => a.date.localeCompare(b.date));
        latestWeightDisplay = sorted[sorted.length - 1].weight + " KG";
    }

    document.getElementById(
        "summaryStats"
    ).innerHTML = `

        <div class="stat">
            <strong>${workouts}</strong>
            <span>WORKOUTS</span>
        </div>

        <div class="stat">
            <strong>${(minutes / 60).toFixed(1)}</strong>
            <span>HOURS</span>
        </div>

        <div class="stat">
            <strong>${calories}</strong>
            <span>KCAL</span>
        </div>

        <div class="stat">
            <strong>${latestWeightDisplay}</strong>
            <span>WEIGHT</span>
        </div>

    `;

    const combinedList = [];

    monthRecords.forEach(r => combinedList.push({...r, itemType: 'activity'}));
    monthWeightLogs.forEach(w => combinedList.push({...w, itemType: 'weight'}));

    combinedList.sort((a, b) => b.date.localeCompare(a.date));

    document.getElementById(
        "summaryList"
    ).innerHTML =

        combinedList.length === 0

        ?

        `

            <div class="empty">

                <div class="empty-title">
                    No records yet.
                </div>

            </div>

        `

        :

        combinedList

        .map(
            item => {

                if (item.itemType === 'weight') {
                    return `
                        <div class="activity-card">
                            <div class="activity-icon">⚖️</div>
                            <div class="activity-info">
                                <div class="activity-name">Weight</div>
                                <div class="activity-meta">${item.date}</div>
                            </div>
                            <div class="activity-kcal">
                                <strong>${item.weight}</strong> KG
                            </div>
                        </div>
                    `;
                }

                const activity =
                    activities.find(
                        act =>
                            act.id ===
                            item.type
                    );


                return `

                    <div
                        class="activity-card"
                    >

                        <div
                            class="activity-icon"
                        >

                            ${activity.icon}

                        </div>


                        <div
                            class="activity-info"
                        >

                            <div
                                class="activity-name"
                            >

                                ${activity.name}

                            </div>


                            <div
                                class="activity-meta"
                            >

                                ${item.date}
                                ·
                                ${item.duration}
                                MIN

                            </div>

                        </div>


                        <div
                            class="activity-kcal"
                        >

                            <strong>
                                ${item.calories}
                            </strong>

                            KCAL

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =========================
   PROFILE
========================= */

function saveProfile() {

    profile.weight =
        Number(
            document.getElementById(
                "weight"
            ).value
        ) || 57;


    profile.height =
        Number(
            document.getElementById(
                "height"
            ).value
        ) || 155;


    localStorage.setItem(

        "33daily_profile",

        JSON.stringify(profile)

    );


    alert(
        "Profile saved."
    );

}
